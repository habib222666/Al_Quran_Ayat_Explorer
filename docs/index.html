<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#075c46">
  <meta name="description" content="আল কুরআনের আয়াত অনুসন্ধান ও বিষয়ভিত্তিক অধ্যয়ন">
  <title>আল-কুরআন ও আয়াত অনুসন্ধান</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div id="app">
    <header class="app-header">
      <div class="brand">
        <h1>আল-কুরআন ও আয়াত অনুসন্ধান</h1>
        <p>আল কুরআনের আয়াত অনুসন্ধান ও বিষয়ভিত্তিক অধ্যয়ন</p>
      </div>

      <button id="themeToggle" type="button" aria-label="থিম পরিবর্তন">
        Dark Mode
      </button>
    </header>

    <main id="mainContent">
      <section class="welcome-section">
        <h2>আল কুরআন</h2>
        <p>পবিত্র কুরআন পড়ুন, অনুসন্ধান করুন এবং অধ্যয়ন করুন।</p>
      </section>

      <section id="quranSection">
        <h2>কুরআন অনুসন্ধান</h2>
        <p>শীঘ্রই এখানে সূরা, আয়াত ও বিষয়ভিত্তিক অনুসন্ধান যুক্ত হবে।</p>
      </section>
    </main>

    <footer class="app-footer">
      <p>আল-কুরআন ও আয়াত অনুসন্ধান</p>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
