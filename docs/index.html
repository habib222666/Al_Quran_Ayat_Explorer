<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#075c46">
  <meta name="description" content="আল কুরআনের ১১৪টি সূরা, আরবি আয়াত, বাংলা অনুবাদ ও ফুটনোট">
  <title>আল-কুরআন ও আয়াত অনুসন্ধান</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="brand">
        <h1>আল-কুরআন ও আয়াত অনুসন্ধান</h1>
        <p>পবিত্র কুরআন পড়ুন, অনুসন্ধান করুন এবং অধ্যয়ন করুন</p>
      </div>
      <div class="header-actions">
        <div class="admin-controls">
          <span id="adminStatus" class="admin-status" hidden>Admin</span>
          <button id="adminLoginToggle" class="header-button" type="button">Admin Login</button>
          <button id="adminLogout" class="header-button" type="button" hidden>Logout</button>
          <form id="adminLoginPanel" class="admin-login-panel" hidden>
            <label for="adminEmail">Admin Email</label>
            <input id="adminEmail" type="email" autocomplete="username" required>
            <label for="adminPassword">Password</label>
            <input id="adminPassword" type="password" autocomplete="current-password" required>
            <button id="adminLoginSubmit" class="header-button" type="submit">Login</button>
            <button id="adminLoginCancel" class="header-button" type="button">Cancel</button>
            <p id="adminLoginMessage" role="status" aria-live="polite"></p>
          </form>
        </div>
        <button id="themeToggle" type="button" aria-label="থিম পরিবর্তন">
          Dark Mode
        </button>
      </div>
    </header>

    <main id="mainContent">
      <section class="welcome-section">
        <h2>الْقُرْآنُ الْكَرِيمُ</h2>
        <p>পবিত্র আল-কুরআনের ১১৪টি সূরা ও ৬,২৩৬টি আয়াত</p>
      </section>

      <section id="quranSection">
        <div id="surahBrowser">
          <div class="section-heading">
            <div>
              <h2>সূরা তালিকা</h2>
              <p>পড়ার জন্য একটি সূরা নির্বাচন করুন</p>
            </div>
            <div class="surah-count-group">
              <button id="surahCount" class="count-badge" type="button" aria-pressed="true">লোড হচ্ছে...</button>
              <button id="makkiCount" class="count-badge" type="button" aria-pressed="false">মাক্কী: —</button>
              <button id="madaniCount" class="count-badge" type="button" aria-pressed="false">মাদানী: —</button>
            </div>
          </div>

          <label class="search-label" for="surahSearch">সূরার নাম বা নম্বর দিয়ে খুঁজুন</label>
          <input
            id="surahSearch"
            class="surah-search"
            type="search"
            placeholder="যেমন: আল-বাকারা অথবা ২"
            autocomplete="off"
          >

          <div id="surahList" class="surah-tables-container" aria-live="polite">
            <p class="loading-message">সূরার তালিকা লোড হচ্ছে...</p>
          </div>
        </div>

        <section id="surahReader" hidden>
          <div class="reader-toolbar">
            <div class="reader-toolbar-left">
              <button id="backToSurahs" class="secondary-button" type="button">← সূরা তালিকা</button>
            </div>
            <div class="surah-navigation">
              <button id="previousSurah" class="secondary-button" type="button">← আগের সূরা</button>
              <button id="nextSurah" class="secondary-button" type="button">পরের সূরা →</button>
            </div>
          </div>

          <div id="surahHeader" class="surah-header">
            <p class="loading-message">সূরা লোড হচ্ছে...</p>
          </div>

          <div id="ayahList" class="ayah-list" aria-live="polite"></div>
        </section>

        <p id="appMessage" class="app-message" role="status" aria-live="polite"></p>
      </section>
    </main>

    <footer class="app-footer">
      <p>আল-কুরআন ও আয়াত অনুসন্ধান</p>
      <p><a href="sources.html">তথ্যসূত্র ও কৃতজ্ঞতা</a></p>
    </footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="data/offline/surah-list.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
